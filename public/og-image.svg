<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#0d2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#479fff"/>
      <stop offset="1" stop-color="#006ee5"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e9ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#479fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#479fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="80" r="280" fill="url(#glow)"/>
  <circle cx="180" cy="560" r="220" fill="url(#glow)" opacity="0.6"/>

  <!-- decorative chat rings -->
  <g opacity="0.12" stroke="#479fff" stroke-width="3" fill="none">
    <circle cx="980" cy="480" r="70"/>
    <circle cx="1080" cy="420" r="50"/>
    <circle cx="900" cy="380" r="40"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(96,168)">
    <rect width="140" height="140" rx="32" fill="url(#accent)"/>
    <path d="M56 34a26 26 0 1 0 0 52 26 26 0 0 0 0-52zm0 13a13 13 0 1 1 0 26 13 13 0 0 1 0-26z" fill="url(#white)"/>
    <path d="M39 78l-11 20 22-9" fill="url(#white)"/>
    <path d="M82 56a26 26 0 1 0 0 52 26 26 0 0 0 0-52zm0 13a13 13 0 1 1 0 26 13 13 0 0 1 0-26z" fill="#ffffff" opacity="0.55"/>
    <path d="M100 100l11 20-22-9" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- title -->
  <text x="96" y="380" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff">G Chat</text>

  <!-- subtitle -->
  <text x="96" y="440" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="500" fill="#8eb8e5">Чат-клиент для Telegram и MAX</text>

  <!-- tagline -->
  <text x="96" y="496" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="400" fill="#5a7a9e">Универсальный мессенджер через GREEN-API</text>

  <!-- badge -->
  <g transform="translate(96,540)">
    <rect width="220" height="44" rx="22" fill="#479fff" fill-opacity="0.15" stroke="#479fff" stroke-opacity="0.4"/>
    <text x="110" y="28" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#479fff">Telegram + MAX</text>
  </g>
</svg>
